<!DOCTYPE html>

<html lang="en">
<head>
    <title>Tic Tac Toe</title>
    <meta name="title" content="Tic Tac Toe"/>
    <meta name="description" content="A tic tac toe game page"/>
    <meta name="viewport" content="width=device-width initial-scale=1.0"/>
    <meta name="keywords" content="game, js, tic tac toe"/>
    <meta name="author" content="Gabriel Vitório dos Santos"/>
    <meta http-equiv="X-UA-Compatible" content="IE=7"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    
    <link rel="stylesheet" href="css/style.css"/>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div class="select-box">
        <header><h2>Tic Tac Toe</h2></header>
        <div class="title">Select which you want to be?</div>
        <div class="options">
            <button class="playerX">Player (X)</button>
            <button class="playerY">Player (Y)</button>
        </div>
    </div>
    <div class="play-board">
        <div class="details">
            <div class="players">
                <span class="Xturn active">X's turn</span>
                <span class="Oturn">O's turn</span>
                <div class="slider"></div>
            </div>
        </div>
        
        <div id="boxes">
            <section>
                <span class="box box01"></span>
                <span class="box box02"></span>
                <span class="box box03"></span>
            </section>
            <section>
                <span class="box box04"></span>
                <span class="box box05"></span>
                <span class="box box06"></span>
            </section>
            <section>
                <span class="box box07"></span>
                <span class="box box08"></span>
                <span class="box box09"></span>
            </section>
        </div>
    </div>

    <div class="result-box">
        <div class="won-text">Player <span class="winner">X</span> won the game</div>
        <div class="btn">
            <button>Replay</button>
        </div>
    </div>
    
</body>
</html>
